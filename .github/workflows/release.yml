name: Release

# Publishes to npm when a version tag is pushed: git tag v0.2.0 && git push --tags
# Requires the repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build # generates sources the typecheck needs
      - run: npm run typecheck
      - run: npm test
      - name: Publish (pre-releases like 1.0.0-rc.1 go to the "beta" tag)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
